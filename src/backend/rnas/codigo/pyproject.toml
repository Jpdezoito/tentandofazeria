[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rna-codigo"
version = "0.1.0"
description = "RNA para treinamento em programação e geração de código"
authors = [{name = "José Paulo Siqueira"}]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "datasets>=2.10.0",
    "accelerate>=0.20.0",
    "tokenizers>=0.13.0",
    "numpy",
    "pandas",
    "scikit-learn",
    "wandb",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
    "flake8",
]

[tool.setuptools]
packages = ["app", "core", "tools"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"